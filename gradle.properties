# Gradle JVM arguments
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Gradle daemon and performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose
android.nonTransitiveRClass=true

# -----------------------------------------------------------------------
# org.gradle.java.home must NOT be committed because it is machine-specific.
# For command-line builds, do ONE of the following:
#   Option A (recommended): Add to  ~/.gradle/gradle.properties :
#     org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
#   Option B: Set the JAVA_HOME environment variable before running gradlew.
# Android Studio sets this automatically via its own JDK configuration.
# -----------------------------------------------------------------------
